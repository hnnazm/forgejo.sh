name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: docker
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip
          terraform_version=1.11.4
          curl --fail --silent --show-error --location \
            --output /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${terraform_version}/terraform_${terraform_version}_linux_amd64.zip"
          unzip -qo /tmp/terraform.zip -d /tmp/terraform
          install -m 0755 /tmp/terraform/terraform /usr/local/bin/terraform
          rm -rf /tmp/terraform /tmp/terraform.zip
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  ansible:
    runs-on: docker
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/ansible-venv
          /tmp/ansible-venv/bin/pip install --no-cache-dir ansible-core==2.18.2 ansible-lint==25.1.3
      - run: /tmp/ansible-venv/bin/ansible-galaxy collection install -r requirements.yml
      - run: /tmp/ansible-venv/bin/ansible-lint .
      - run: /tmp/ansible-venv/bin/ansible-playbook --syntax-check -i inventory.ini site.yml
