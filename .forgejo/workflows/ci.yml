name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: docker
    container:
      image: localhost/forgejo-ci-terraform:1
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  ansible:
    runs-on: docker
    container:
      image: localhost/forgejo-ci-ansible:1
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint .
      - run: ansible-playbook --syntax-check -i inventory.ini site.yml
