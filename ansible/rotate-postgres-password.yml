---
- name: Rotate the Forgejo PostgreSQL password
  hosts: forgejo_host
  become: true
  vars_prompt:
    - name: pg_new_password
      prompt: New Forgejo PostgreSQL password
      private: true
      confirm: true

  pre_tasks:
    - name: Require the prompted password to match the encrypted desired state
      ansible.builtin.assert:
        that:
          - pg_new_password == vault_forgejo_db_password
        fail_msg: >-
          First update vault_forgejo_db_password in group_vars/all/vault.yml,
          then enter that same password here.
      no_log: true

  tasks:
    - name: Change the Forgejo PostgreSQL role password
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -i
          - forgejo-db
          - psql
          - -U
          - "{{ forgejo_db_user }}"
          - -d
          - "{{ forgejo_db_name }}"
          - -v
          - ON_ERROR_STOP=1
        stdin: >-
          ALTER ROLE "{{ forgejo_db_user | replace('"', '""') }}"
          PASSWORD '{{ pg_new_password | replace("'", "''") }}';
      changed_when: true
      no_log: true

    - name: Apply the PostgreSQL Quadlet desired state
      ansible.builtin.import_role:
        name: postgres

    - name: Apply the Forgejo Quadlet desired state
      ansible.builtin.import_role:
        name: forgejo
