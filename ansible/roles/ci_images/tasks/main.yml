---
- name: Create the local CI base image build directory
  ansible.builtin.file:
    path: "{{ ci_images_root }}/base"
    state: directory
    mode: "0755"

- name: Copy the local CI base image Containerfile
  ansible.builtin.copy:
    src: base.Containerfile
    dest: "{{ ci_images_root }}/base/Containerfile"
    mode: "0644"

- name: Build the local CI base image when its version tag is absent
  containers.podman.podman_image:
    name: "{{ ci_base_image }}"
    path: "{{ ci_images_root }}/base"
    build:
      file: "{{ ci_images_root }}/base/Containerfile"
      format: oci
    pull: true
