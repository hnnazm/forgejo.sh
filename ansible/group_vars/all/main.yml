---
forgejo_user: forgejo
forgejo_group: forgejo
forgejo_user_home: /var/lib/forgejo

podman_network: forgejo-net
forgejo_data_root: /srv/forgejo
postgres_data_root: /srv/forgejo-db
runners_root: /srv/forgejo-runners

forgejo_version: "16.0.1"
runner_version: "12.13.2"
postgres_version: "17-alpine"
cloudflared_version: "latest"
forgejo_external_hostname: forgejo.example.com
forgejo_instance_url: http://forgejo:3000
forgejo_admin_username: forgejo
forgejo_admin_email: admin@example.com
forgejo_db_name: forgejo
forgejo_db_user: forgejo

runner_count: 2
runner_concurrent: 1
runner_labels: docker
runner_privileged: true
runner_container_uid: "1000"
default_ci_image: node:20-bookworm
